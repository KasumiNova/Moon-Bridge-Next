name: Release

# 触发：
#   * 每次推送到主干/开发分支 —— 全矩阵构建（CI 验证，不发布）
#   * 推送 Release 前缀的 tag —— 构建 + 发布。
#     版本约定 Major.minor.patch：patch 0 = alpha（开发版）、1 = beta
#     （测试版）、>=2 = GA；patch 0/1 发布为 GitHub pre-release。
#     如 Release/0.1.0（alpha）、Release/0.1.1（beta）、Release/0.1.2（GA）。
on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      # 通配符 * 不跨 /，Release/0.1.0 需要 **（覆盖 Release/x.y.z 与 Release-x.y.z）
      - "Release**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux：deb / rpm / AppImage（Tauri v2 已移除 pacman bundle）──
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          # ── macOS：DMG（无证书 → ad-hoc 签名）；x86_64 在 arm runner 交叉编译 ──
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          # ── Windows：NSIS 安装包（简体中文）──
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
    env:
      # macOS 未配置 Apple 证书：'-' 即 ad-hoc 签名，产物可直接本机运行
      APPLE_SIGNING_IDENTITY: "-"
      # linuxdeploy AppImage 在 CI runner 上无 FUSE 可用，改为解压运行
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf libssl-dev rpm \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.name == 'windows-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path $llvmBin)) { throw "LLVM not found at $llvmBin" }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # 版本号即 tag 去掉 Release 前缀：Major.minor.patch（0=alpha、1=beta、2=GA）。
      # 分支构建沿用仓库内版本。三处同步：workspace.package（二进制 --version
      # 与管理 API）、tauri.conf.json（产物名与包元数据）、ui/package.json。
      - name: Derive and apply app version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            APP_VERSION="${GITHUB_REF_NAME#Release}"; APP_VERSION="${APP_VERSION#[/-]}"
            IFS=. read -r a b c <<< "$APP_VERSION"
            APP_VERSION="${a}.${b:-0}.${c:-0}"
            # -i.bak：BSD sed（macOS）的 -i 必须带后缀参数，无参写法只在 GNU 下可用
            sed -i.bak '/^\[workspace\.package\]/,/^\[/s/^version = ".*"/version = "'"$APP_VERSION"'"/' Cargo.toml
            sed -i.bak 's/"version": ".*"/"version": "'"$APP_VERSION"'"/' src-tauri/tauri.conf.json ui/package.json
          else
            APP_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "app version: $APP_VERSION"

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install Tauri CLI
        shell: bash
        run: npm install -g @tauri-apps/cli@^2

      - name: Install Linux bundling prerequisites
        # x86_64 runner 自带 xdg-utils；ubuntu-24.04-arm 没有，AppImage 打包
        # 需要 xdg-open（failed: xdg-open binary not found）
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xdg-utils

      - name: Build Tauri app
        shell: bash
        # beforeBuildCommand 在 tauri.conf.json 里用显式 cwd（{script,cwd:"../ui"}），
        # 从仓库根运行即可：cwd 相对 src-tauri/ 解析，与运行目录无关。
        run: tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # 产物自带架构后缀（amd64/arm64、x64/arm64、aarch64），无需重命名
      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # cargo workspace：产物目录在仓库根 target/，非 src-tauri/target/
          for base in target src-tauri/target; do
            d="$base/${{ matrix.target }}/release/bundle"
            if [ -d "$d" ]; then
              find "$d" -type f \( \
                -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o \
                -name '*.dmg' -o -name '*-setup.exe' \) -exec cp {} release-assets/ \;
            fi
          done
          ls -la release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  # ── Linux pacman：Tauri v2 已移除 pacman bundle，改用 PKGBUILD 源码构建 ──
  build-arch:
    name: Build linux-x86_64 (pacman)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # checkout 需要 git；base-devel/sudo 供 makepkg 与非 root 构建用户使用
      - name: Install base tooling
        run: |
          # 容器镜像可能过期：先刷新 keyring 再升级，避免签名校验失败
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed git base-devel sudo

      - name: Checkout
        uses: actions/checkout@v4

      # 与 build job 同一口径：Release tag → tag 去前缀；分支 → 仓库内版本
      - name: Derive app version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            APP_VERSION="${GITHUB_REF_NAME#Release}"; APP_VERSION="${APP_VERSION#[/-]}"
            IFS=. read -r a b c <<< "$APP_VERSION"
            APP_VERSION="${a}.${b:-0}.${c:-0}"
          else
            APP_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "app version: $APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      # PKGBUILD 源码包：从当前 checkout（tag 构建时 HEAD 即 tag）归档，
      # 顶层目录固定为 moon-bridge-next-<pkgver>/，与 PKGBUILD 中的 cd 一致
      - name: Create source tarball
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --prefix="moon-bridge-next-${APP_VERSION}/" \
            -o "deploy/arch/moon-bridge-next-${APP_VERSION}.tar.gz" HEAD

      - name: Inject pkgver and tarball checksum
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/arch
          sed -i 's/^pkgver=.*/pkgver='"${APP_VERSION}"'/' PKGBUILD
          sum="$(sha256sum "moon-bridge-next-${APP_VERSION}.tar.gz" | cut -d' ' -f1)"
          sed -i "s/TARBALL_SHA256_PLACEHOLDER/${sum}/" PKGBUILD

      # makepkg 拒绝 root：建 NOPASSWD 构建用户，-s 经 pacman 补齐 makedepends
      - name: Build pacman package
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd deploy/arch
          sudo -u builder env HOME=/home/builder makepkg -s --noconfirm

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp deploy/arch/*.pkg.tar.zst release-assets/
          ls -la release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-linux-x86_64-pacman
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build, build-arch]
    # 仅 Release tag 触发发布；分支推送只做构建验证
    if: startsWith(github.ref, 'refs/tags/Release')
    permissions:
      contents: write
    steps:
      # checkout 必须在下载产物之前：默认 clean 会 git clean -ffdx，
      # 放在后面会把 release-assets/ 整个删掉。
      # fetch-depth=0：需要完整 tag 历史来生成「上一 release 到本 release」的提交清单
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets

      # tag 形如 Release/0.1.0：patch 0=alpha、1=beta 发 pre-release，其余为 GA；
      # 展示名在预发布版本后补通道后缀（Moon Bridge Next 0.1.0-alpha）。
      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#Release}"; v="${v#[/-]}"
          suffix=""
          # *.*.N 限定三段版本：两段 tag（如 Release/0.1）不误判为 beta
          case "$v" in
            *.*.0) suffix="-alpha";;
            *.*.1) suffix="-beta";;
          esac
          pre=false; [ -n "$suffix" ] && pre=true
          {
            echo "version=$v"
            echo "suffix=$suffix"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          title="Moon Bridge Next ${{ steps.channel.outputs.version }}${{ steps.channel.outputs.suffix }}"
          prev="$(git tag -l 'Release*' --sort=-version:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)"
          {
            echo "## $title"
            echo
            if [ -n "$prev" ]; then
              echo "### 变更（自 $prev）"
              echo
              git log --oneline --no-decorate "$prev..HEAD" | sed 's/^/- /'
            else
              echo "### 变更"
              echo
              git log --oneline --no-decorate HEAD | sed 's/^/- /'
            fi
            echo
            echo "### 下载"
            echo
            echo "- **Linux x86_64**：\`*_amd64.deb\` / \`*.x86_64.rpm\` / \`*_amd64.AppImage\`"
            echo "- **Linux arm64**：\`*_arm64.deb\` / \`*.aarch64.rpm\` / \`*_aarch64.AppImage\`"
            echo "- **Arch Linux**：\`moon-bridge-next-*-x86_64.pkg.tar.zst\`（\`sudo pacman -U\` 安装）"
            echo "- **macOS**：\`*_aarch64.dmg\`（Apple Silicon）/ \`*_x64.dmg\`（Intel）"
            echo "- **Windows**：\`*_x64-setup.exe\` / \`*_arm64-setup.exe\`（NSIS 安装包，简体中文）"
            echo
            echo "> macOS 构建为 ad-hoc 签名：首次打开若被 Gatekeeper 拦截，右键 →「打开」即可。"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Moon Bridge Next ${{ steps.channel.outputs.version }}${{ steps.channel.outputs.suffix }}
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: release-assets/*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
